<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulaIsRed</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="page">
    <section class="profile-card">
      <div class="avatar-ring">
    <img src="red.png" alt="Profile Picture" class="avatar">
      </div>

      <h1>Red</h1>
      <p class="handle">@pulaisred</p>

      <div class="badges" aria-label="Profile badges">
        <span>✦</span>
        <span>★</span>
      </div>

      <p class="motto">Sometimes, life writes things in our favor.</p>

      <div class="status-card">
  <div class="status-top">
    <div class="mini-avatar">
 <img
  id="discord-avatar"
  src=""
  alt="Discord Avatar"
  style="width:43px !important; height:43px !important; max-width:43px !important; max-height:43px !important; object-fit:cover !important; border-radius:13px !important; display:block !important;"
>
</div>

    <div>
      <strong id="discord-name">pulaisred</strong>
      <small id="discord-activity">Connecting...</small>
    </div>

    <span id="discord-dot" class="online-dot"></span>
  </div>

  <div class="status-line"></div>

  <p id="discord-status">Loading Discord status...</p>
</div>
      </div>

      <nav class="socials" aria-label="Social links">
        <a href="https://discord.com" target="_blank" rel="noreferrer" title="Discord">
  <svg viewBox="0 0 24 24" aria-hidden="true" class="discord-icon">
    <path fill="currentColor" d="M19.54 0.99A18.55 18.55 0 0 0 14.96 0l-.56 1.15a17.78 17.78 0 0 0-4.8 0L9.04 0a18.6 18.6 0 0 0-4.58.99C1.56 5.27.77 9.44.99 13.55c1.83 1.37 3.61 2.2 5.37 2.75l1.3-1.77c-.72-.27-1.42-.61-2.08-1.03l.51-.39c4.01 1.85 8.36 1.85 12.32 0l.51.39c-.66.42-1.36.76-2.08 1.03l1.3 1.77c1.76-.55 3.54-1.38 5.37-2.75.26-4.76-.8-8.89-3.87-12.56ZM8.76 11.42c-1.18 0-2.15-1.08-2.15-2.4s.95-2.4 2.15-2.4 2.17 1.08 2.15 2.4c0 1.32-.95 2.4-2.15 2.4Zm6.48 0c-1.18 0-2.15-1.08-2.15-2.4s.95-2.4 2.15-2.4 2.17 1.08 2.15 2.4c0 1.32-.95 2.4-2.15 2.4Z"/>
  </svg>
</a>
      </nav>
    </section>

    <section class="music-player" aria-label="Music player">
      <div class="record"><span></span></div>
      <div class="track-info">
        <h2>Yk</h2>
        <p>Sean Jr.</p>
        <div class="progress-row">
          <span id="currentTime">0:00</span>
          <input id="progress" type="range" min="0" max="100" value="0" aria-label="Song progress" />
          <span id="duration">0:00</span>
        </div>
      </div>
      <div class="controls">
        <button id="previous" aria-label="Previous track">|‹</button>
        <button id="playButton" class="play" aria-label="Play music">▶</button>
        <button id="next" aria-label="Next track">›|</button>
      </div>
      <audio id="audio" src="ykyk.mp3" preload="auto"></audio>
    </section>
  </main>

  <div class="volume-control">
    <span>🔊</span>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume" />
  </div>

  <footer>made with ♥ and caffeine</footer>
  <script src="script.js"></script>
</body>
</html>
