<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulaIsRed</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="page">
    <section class="profile-card">
      <div class="avatar-ring">
    <img src="red.png" alt="Profile Picture" class="avatar">
      </div>

      <h1>Red</h1>
      <p class="handle">@pulaisred</p>

      <div class="badges" aria-label="Profile badges">
        <span>✦</span>
        <span>★</span>
      </div>

      <p class="motto">Sometimes, life writes things in our favor.</p>

      <div class="status-card">
        <div class="status-top">
          <div class="mini-avatar">K</div>
          <div>
            <strong>pulaisred <span class="verified">◆</span></strong>
            <small>..................</small>
          </div>
          <span class="online-dot"></span>
        </div>
        <div class="status-line"></div>
        <p>-----------------------</p>
      </div>

      <nav class="socials" aria-label="Social links">
        <a href="https://discord.com" target="_blank" rel="noreferrer" title="Discord">◉</a>
        <a href="https://www.facebook.com" target="_blank" rel="noreferrer" title="Facebook">f</a>
        <a href="https://open.spotify.com" target="_blank" rel="noreferrer" title="Spotify">◉</a>
        <a href="https://www.tiktok.com" target="_blank" rel="noreferrer" title="TikTok">♪</a>
        <a href="https://www.instagram.com" target="_blank" rel="noreferrer" title="Instagram">◎</a>
        <a href="https://www.youtube.com" target="_blank" rel="noreferrer" title="YouTube">▶</a>
      </nav>
    </section>

    <section class="music-player" aria-label="Music player">
      <div class="record"><span></span></div>
      <div class="track-info">
        <h2>Yk</h2>
        <p>Sean Jr.</p>
        <div class="progress-row">
          <span id="currentTime">0:00</span>
          <input id="progress" type="range" min="0" max="100" value="0" aria-label="Song progress" />
          <span id="duration">0:00</span>
        </div>
      </div>
      <div class="controls">
        <button id="previous" aria-label="Previous track">|‹</button>
        <button id="playButton" class="play" aria-label="Play music">▶</button>
        <button id="next" aria-label="Next track">›|</button>
      </div>
      <audio id="audio" src="ykyk.mp3" preload="auto"></audio>
    </section>
  </main>

  <div class="volume-control">
    <span>🔊</span>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume" />
  </div>

  <footer>made with ♥ and caffeine</footer>
  <script src="script.js"></script>
</body>
</html>
